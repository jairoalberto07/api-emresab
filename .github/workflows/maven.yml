name: Java CI with Maven (ERS-EMRESAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código fuente
      uses: actions/checkout@v3

    - name: Configurar el entorno JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Compilar el proyecto y ejecutar pruebas unitarias
      run: mvn -B package --file pom.xml